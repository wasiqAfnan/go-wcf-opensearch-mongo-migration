services:
  # 1. SQL Server for Transactional Customer Records
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: learningstack-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in the .env file}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped

  # 2. OpenSearch for Legacy Invoices / Search Records
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: learningstack-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    restart: unless-stopped

  # 3. MongoDB for Modern Target Document Store
  mongodb:
    image: mongo:7.0
    container_name: learningstack-mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  sqlserver_data:
  opensearch_data:
  mongo_data:
